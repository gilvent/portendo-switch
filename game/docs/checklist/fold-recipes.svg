<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" width="900" height="376" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="376" fill="#fbf7ee"/><text x="24" y="34" font-size="20" fill="#2f343c" text-anchor="start" font-weight="700">How the fox and the pine are built: fold, cut, glue</text><rect x="20" y="56" width="420" height="300" fill="#fff" stroke="#d9d2c4"/><text x="36" y="82" font-size="16" fill="#2f343c" text-anchor="start" font-weight="700">Fox: a tent fold with two cards glued on</text><path d="M60 130H230V250H60Z" fill="#e07a2e"/><path d="M60 190H230" stroke="#fff" stroke-width="2" stroke-dasharray="7 5"/><path d="M100 250V226Q145 214 190 226V250Z M100 130V154Q145 166 190 154V130Z" fill="#fff"/><text x="145" y="276" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">1. body sheet, folded</text><text x="145" y="292" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">along the spine</text><path d="M290 200L320 172L318 130L300 152H280L262 130L260 172Z" fill="#e07a2e"/><path d="M290 200L320 172L300 178L290 190L280 178L260 172Z" fill="#f6ecdc"/><text x="290" y="226" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">2. head card,</text><text x="290" y="242" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">glued in front</text><path d="M370 200Q420 190 408 130Q380 150 370 200Z" fill="#e07a2e"/><ellipse cx="408" cy="136" rx="14" ry="12" fill="#f6ecdc"/><text x="392" y="226" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">3. tail card,</text><text x="392" y="242" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">glued behind</text><text x="36" y="326" font-size="13.5" fill="#2f343c" text-anchor="start" font-weight="400">Detail (white chest, dark paws, face) is cut pieces and</text><text x="36" y="344" font-size="13.5" fill="#2f343c" text-anchor="start" font-weight="400">tones of the same orange, not drawn outlines.</text><rect x="460" y="56" width="420" height="300" fill="#fff" stroke="#d9d2c4"/><text x="476" y="82" font-size="16" fill="#2f343c" text-anchor="start" font-weight="700">Pine: two identical cards slotted together</text><path d="M534 250V234H496L520 198H506L528 162H516L540 120L564 162H552L574 198H560L584 234H546V250Z" fill="#2f8a5f"/><path d="M540 120L564 162H552L574 198H560L584 234H540Z" fill="#22704f"/><rect x="538.5" y="120" width="3" height="65" fill="#fff"/><path d="M644 250V234H606L630 198H616L638 162H626L650 120L674 162H662L684 198H670L694 234H656V250Z" fill="#2f8a5f"/><path d="M650 120L674 162H662L684 198H670L694 234H650Z" fill="#22704f"/><rect x="648.5" y="185" width="3" height="65" fill="#fff"/><text x="595" y="276" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">1. two cards, one slotted from</text><text x="595" y="292" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">the top, one from the bottom</text><path d="M794 250V234H756L780 198H766L788 162H776L800 120L824 162H812L834 198H820L844 234H806V250Z" fill="#2f8a5f"/><path d="M800 120L824 162H812L834 198H820L844 234H800Z" fill="#22704f"/><path d="M800 120L812 162H806L818 198H810L822 234H800Z" fill="#3d9a5a" transform="skewX(-14) translate(58 0)"/><text x="800" y="276" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">2. crossed at right angles:</text><text x="800" y="292" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">it stands and has volume</text><text x="476" y="326" font-size="13.5" fill="#2f343c" text-anchor="start" font-weight="400">The lit half is a lighter green than the shaded half.</text><text x="476" y="344" font-size="13.5" fill="#2f343c" text-anchor="start" font-weight="400">Every tier stays visible from any side.</text></svg>