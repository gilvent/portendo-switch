<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="396" fill="#fbf7ee"/><text x="24" y="34" font-size="20" fill="#2f343c" text-anchor="start" font-weight="700">The gap between layers decides whether the depth can be seen</text><rect x="20" y="60" width="400" height="230" fill="#fff" stroke="#d9d2c4"/><text x="34" y="84" font-size="13" fill="#6b7480" text-anchor="start" font-weight="400">Seen from the side</text><path d="M50 262H270" stroke="#cdb48c" stroke-width="6"/><rect x="80" y="120" width="7" height="142" fill="#cfdfe8" stroke="#2f343c" stroke-width="1"/><rect x="92" y="150" width="7" height="112" fill="#9cc7a6" stroke="#2f343c" stroke-width="1"/><rect x="104" y="180" width="7" height="82" fill="#5ea25e" stroke="#2f343c" stroke-width="1"/><circle cx="256" cy="150" r="9" fill="#2f343c"/><path d="M246 150L80 190" stroke="#2f343c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="242" y="132" font-size="12" fill="#6b7480" text-anchor="start" font-weight="400">camera</text><rect x="288" y="100" width="118" height="150" fill="#bfe3f2"/><text x="288" y="92" font-size="13" fill="#6b7480" text-anchor="start" font-weight="400">Seen from the front</text><path d="M288 250V156Q347 136 406 156V250Z" fill="#cfdfe8"/><path d="M288 184Q347 164 406 184V186H288Z" fill="#000" opacity=".22"/><path d="M288 250V186Q347 166 406 186V250Z" fill="#9cc7a6"/><path d="M288 214Q347 194 406 214V216H288Z" fill="#000" opacity=".22"/><path d="M288 250V216Q347 196 406 216V250Z" fill="#5ea25e"/><g transform="translate(42 316)"><circle r="14" fill="#c8452f"/><path d="M-6 -6L6 6M6 -6L-6 6" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="322" font-size="17" fill="#c8452f" text-anchor="start" font-weight="700">Almost touching: reads as one print</text><rect x="470" y="60" width="400" height="230" fill="#fff" stroke="#d9d2c4"/><text x="484" y="84" font-size="13" fill="#6b7480" text-anchor="start" font-weight="400">Seen from the side</text><path d="M500 262H720" stroke="#cdb48c" stroke-width="6"/><rect x="530" y="120" width="7" height="142" fill="#cfdfe8" stroke="#2f343c" stroke-width="1"/><rect x="580" y="150" width="7" height="112" fill="#9cc7a6" stroke="#2f343c" stroke-width="1"/><rect x="630" y="180" width="7" height="82" fill="#5ea25e" stroke="#2f343c" stroke-width="1"/><circle cx="706" cy="150" r="9" fill="#2f343c"/><path d="M696 150L530 190" stroke="#2f343c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="692" y="132" font-size="12" fill="#6b7480" text-anchor="start" font-weight="400">camera</text><rect x="738" y="100" width="118" height="150" fill="#bfe3f2"/><text x="738" y="92" font-size="13" fill="#6b7480" text-anchor="start" font-weight="400">Seen from the front</text><path d="M738 250V156Q797 136 856 156V250Z" fill="#cfdfe8"/><path d="M738 174Q797 154 856 174V186H738Z" fill="#000" opacity=".22"/><path d="M738 250V186Q797 166 856 186V250Z" fill="#9cc7a6"/><path d="M738 204Q797 184 856 204V216H738Z" fill="#000" opacity=".22"/><path d="M738 250V216Q797 196 856 216V250Z" fill="#5ea25e"/><g transform="translate(492 316)"><circle r="14" fill="#2a8d6a"/><path d="M-7 0L-2 6L8 -6" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="514" y="322" font-size="17" fill="#2a8d6a" text-anchor="start" font-weight="700">Stood well apart: visible shadows</text><text x="20" y="356" font-size="15" fill="#6b7480" text-anchor="start" font-weight="400">Your words on the hometown valley: "The layer depth is also very minimum. This makes it look half-baked."</text><text x="20" y="378" font-size="15" fill="#6b7480" text-anchor="start" font-weight="400">On the Blibli river view, once each layer threw a visible shadow on the next: "yes, it meets."</text></svg>