<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" width="900" height="376" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="376" fill="#fbf7ee"/><text x="24" y="34" font-size="20" fill="#2f343c" text-anchor="start" font-weight="700">When a single flat card is allowed for an object</text><rect x="20" y="56" width="200" height="250" fill="#fff" stroke="#d9d2c4"/><g transform="translate(46 84)"><circle r="14" fill="#2a8d6a"/><path d="M-7 0L-2 6L8 -6" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="68" y="90" font-size="17" fill="#2a8d6a" text-anchor="start" font-weight="700">OK</text><text x="120" y="290" font-size="13.5" fill="#2f343c" text-anchor="middle" font-weight="700">Near a surface or structure</text><rect x="240" y="56" width="200" height="250" fill="#fff" stroke="#d9d2c4"/><g transform="translate(266 84)"><circle r="14" fill="#2a8d6a"/><path d="M-7 0L-2 6L8 -6" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="288" y="90" font-size="17" fill="#2a8d6a" text-anchor="start" font-weight="700">OK</text><text x="340" y="290" font-size="13.5" fill="#2f343c" text-anchor="middle" font-weight="700">Naturally plane-shaped</text><rect x="460" y="56" width="200" height="250" fill="#fff" stroke="#d9d2c4"/><g transform="translate(486 84)"><circle r="14" fill="#2a8d6a"/><path d="M-7 0L-2 6L8 -6" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="508" y="90" font-size="17" fill="#2a8d6a" text-anchor="start" font-weight="700">OK</text><text x="560" y="290" font-size="13.5" fill="#2f343c" text-anchor="middle" font-weight="700">Flat on purpose: people</text><rect x="680" y="56" width="200" height="250" fill="#fff" stroke="#d9d2c4"/><g transform="translate(706 84)"><circle r="14" fill="#c8452f"/><path d="M-6 -6L6 6M6 -6L-6 6" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="728" y="90" font-size="17" fill="#c8452f" text-anchor="start" font-weight="700">Not OK</text><text x="780" y="290" font-size="13.5" fill="#2f343c" text-anchor="middle" font-weight="700">Anything else in open space</text><rect x="40" y="110" width="160" height="110" fill="#e3c9a0"/><rect x="60" y="126" width="50" height="40" fill="#ffdf9e"/><rect x="62" y="196" width="120" height="10" fill="#8a5530"/><rect x="62" y="176" width="120" height="16" fill="#b5773f"/><rect x="70" y="206" width="6" height="26" fill="#2b2f36"/><rect x="168" y="206" width="6" height="26" fill="#2b2f36"/><rect x="40" y="232" width="160" height="14" fill="#f1e4cc"/><rect x="318" y="150" width="6" height="90" fill="#2f343c"/><rect x="286" y="110" width="70" height="46" rx="5" fill="#f5b400" stroke="#2f343c" stroke-width="2"/><circle cx="392" cy="212" r="28" fill="none" stroke="#2f343c" stroke-width="8"/><circle cx="392" cy="212" r="5" fill="#2f343c"/><g transform="translate(560 232) scale(1.5)"><rect x="-13" y="-34" width="26" height="30" rx="6" fill="#22324a" stroke="#fff" stroke-width="4"/><circle cy="-52" r="22" fill="#f3c9a0" stroke="#fff" stroke-width="4"/><path d="M-22 -56Q-16 -78 4 -74Q22 -72 22 -54Q8 -64 -22 -56Z" fill="#1d1a17"/></g><rect x="734" y="170" width="10" height="64" fill="#7a5c42"/><ellipse cx="739" cy="150" rx="40" ry="34" fill="#4aa067"/><path d="M800 228h56l-6 -22h-30l-8 10h-12Z" fill="#0092da"/><circle cx="812" cy="232" r="9" fill="#2f343c"/><circle cx="846" cy="232" r="9" fill="#2f343c"/><text x="20" y="336" font-size="15" fill="#6b7480" text-anchor="start" font-weight="400">Details on a flat card come from colour: pieces in lighter and darker tones of its own colour. Not outlines.</text><text x="20" y="358" font-size="15" fill="#6b7480" text-anchor="start" font-weight="400">A freestanding tree, scooter, bicycle, animal or bush standing in open space must be folded and glued instead.</text></svg>