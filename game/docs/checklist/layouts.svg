<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" width="900" height="404" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="404" fill="#fbf7ee"/><text x="24" y="34" font-size="20" fill="#2f343c" text-anchor="start" font-weight="700">Each scene needs a layout of its own</text><rect x="20" y="56" width="270" height="220" fill="#fff" stroke="#d9d2c4"/><text x="155" y="78" font-size="15" fill="#2f343c" text-anchor="middle" font-weight="700">Blibli street</text><rect x="40" y="150" width="230" height="96" fill="#f1e4cc" stroke="#cdb48c"/><text x="155" y="204" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">main space</text><rect x="40" y="150" width="26" height="96" fill="#c98a6e"/><text x="53.0" y="203.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700"></text><rect x="244" y="150" width="26" height="96" fill="#c98a6e"/><text x="257.0" y="203.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700"></text><rect x="40" y="96" width="80" height="54" fill="#bfe3f2"/><text x="80.0" y="128.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700">open</text><rect x="120" y="96" width="150" height="54" fill="#c98a6e"/><text x="195.0" y="128.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700">shop + relief</text><g transform="translate(42 300)"><circle r="14" fill="#2a8d6a"/><path d="M-7 0L-2 6L8 -6" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="64" y="306" font-size="17" fill="#2a8d6a" text-anchor="start" font-weight="700">OK</text><rect x="315" y="56" width="270" height="220" fill="#fff" stroke="#d9d2c4"/><text x="450" y="78" font-size="15" fill="#2f343c" text-anchor="middle" font-weight="700">Hometown, first version</text><rect x="335" y="150" width="230" height="96" fill="#f1e4cc" stroke="#cdb48c"/><text x="450" y="204" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">main space</text><rect x="335" y="150" width="26" height="96" fill="#c98a6e"/><text x="348.0" y="203.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700"></text><rect x="539" y="150" width="26" height="96" fill="#c98a6e"/><text x="552.0" y="203.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700"></text><rect x="335" y="96" width="60" height="54" fill="#a3adf2"/><text x="365.0" y="128.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700">homes</text><rect x="395" y="96" width="50" height="54" fill="#bfe3f2"/><text x="420.0" y="128.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700">open</text><rect x="445" y="96" width="120" height="54" fill="#a3adf2"/><text x="505.0" y="128.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700">homes</text><g transform="translate(337 300)"><circle r="14" fill="#c8452f"/><path d="M-6 -6L6 6M6 -6L-6 6" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="359" y="306" font-size="17" fill="#c8452f" text-anchor="start" font-weight="700">Too alike</text><rect x="610" y="56" width="270" height="220" fill="#fff" stroke="#d9d2c4"/><text x="745" y="78" font-size="15" fill="#2f343c" text-anchor="middle" font-weight="700">Hometown, current version</text><rect x="630" y="150" width="230" height="96" fill="#f1e4cc" stroke="#cdb48c"/><text x="745" y="204" font-size="13" fill="#6b7480" text-anchor="middle" font-weight="400">main space</text><rect x="630" y="96" width="60" height="54" fill="#bfe3f2"/><text x="660.0" y="128.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700">open</text><rect x="690" y="96" width="110" height="54" fill="#a3adf2"/><text x="745.0" y="128.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700">homes</text><rect x="800" y="96" width="60" height="54" fill="#bfe3f2"/><text x="830.0" y="128.0" font-size="12" fill="#2f343c" text-anchor="middle" font-weight="700">open</text><g transform="translate(632 300)"><circle r="14" fill="#2a8d6a"/><path d="M-7 0L-2 6L8 -6" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="654" y="306" font-size="17" fill="#2a8d6a" text-anchor="start" font-weight="700">OK</text><text x="24" y="344" font-size="14" fill="#6b7480" text-anchor="start" font-weight="400">Brown = relief buildings on the bounds. Blue = the open view. Lavender = the homes.</text><text x="24" y="366" font-size="14" fill="#6b7480" text-anchor="start" font-weight="400">Your words on the first hometown: "the hometown square layout is very similar with Blibli, particularly: relief structure on</text><text x="24" y="386" font-size="14" fill="#6b7480" text-anchor="start" font-weight="400">left and right bounds; visible view position is exactly the same as blibli's docking gate". Also: "Don't use river like blibli scene."</text></svg>