<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="580" fill="#fbf7ee"/><text x="24" y="34" font-size="20" fill="#2f343c" text-anchor="start" font-weight="700">Plan view of any scene: which technique goes where</text><rect x="40" y="60" width="520" height="70" fill="#d3e4ee"/><rect x="40" y="96" width="520" height="12" fill="#b9d6c6"/><rect x="40" y="112" width="520" height="12" fill="#9cc7a6"/><text x="300" y="86" font-size="15" fill="#2f343c" text-anchor="middle" font-weight="700">OPEN SURROUNDINGS: the eye travels far</text><rect x="560" y="60" width="300" height="70" fill="#c98a6e"/><text x="710" y="100" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">ENCLOSED: a wall close by</text><rect x="820" y="130" width="40" height="260" fill="#c98a6e"/><rect x="40" y="130" width="780" height="260" fill="#f1e4cc" stroke="#cdb48c" stroke-width="2"/><text x="430" y="250" font-size="26" fill="#2f343c" text-anchor="middle" font-weight="700">MAIN SPACE</text><text x="430" y="278" font-size="16" fill="#6b7480" text-anchor="middle" font-weight="400">where the player walks and plays</text><g transform="translate(430 360) scale(0.9)"><rect x="-13" y="-34" width="26" height="30" rx="6" fill="#22324a" stroke="#fff" stroke-width="4"/><circle cy="-52" r="22" fill="#f3c9a0" stroke="#fff" stroke-width="4"/><path d="M-22 -56Q-16 -78 4 -74Q22 -72 22 -54Q8 -64 -22 -56Z" fill="#1d1a17"/></g><path d="M300 220V140" stroke="#2a8d6a" stroke-width="4" marker-end="url(#a)"/><path d="M640 220L700 140" stroke="#c8452f" stroke-width="4"/><path d="M700 300H812" stroke="#c8452f" stroke-width="4"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2a8d6a"/></marker></defs><rect x="40" y="410" width="250" height="100" fill="#fff" stroke="#d9d2c4"/><text x="52" y="434" font-size="16" fill="#2f343c" text-anchor="start" font-weight="700">Main space</text><text x="52" y="456" font-size="14" fill="#2f343c" text-anchor="start" font-weight="400">Freestanding objects with</text><text x="52" y="474" font-size="14" fill="#2f343c" text-anchor="start" font-weight="400">real volume: folded, cut</text><text x="52" y="492" font-size="14" fill="#2f343c" text-anchor="start" font-weight="400">and glued.</text><rect x="305" y="410" width="250" height="100" fill="#fff" stroke="#d9d2c4"/><text x="317" y="434" font-size="16" fill="#2f343c" text-anchor="start" font-weight="700">Open surroundings</text><text x="317" y="456" font-size="14" fill="#2f343c" text-anchor="start" font-weight="400">Layered shadow box: many</text><text x="317" y="474" font-size="14" fill="#2f343c" text-anchor="start" font-weight="400">flat cut sheets stood apart,</text><text x="317" y="492" font-size="14" fill="#2f343c" text-anchor="start" font-weight="400">each with its own detail.</text><rect x="570" y="410" width="290" height="100" fill="#fff" stroke="#d9d2c4"/><text x="582" y="434" font-size="16" fill="#2f343c" text-anchor="start" font-weight="700">Enclosed surroundings</text><text x="582" y="456" font-size="14" fill="#2f343c" text-anchor="start" font-weight="400">Relief papercraft fixed to the</text><text x="582" y="474" font-size="14" fill="#2f343c" text-anchor="start" font-weight="400">surface and sticking out toward</text><text x="582" y="492" font-size="14" fill="#2f343c" text-anchor="start" font-weight="400">the main space.</text><text x="40" y="540" font-size="15" fill="#6b7480" text-anchor="start" font-weight="400">Open or enclosed is judged standing in the main space. It does not depend on which side of the box it is:</text><text x="40" y="560" font-size="15" fill="#6b7480" text-anchor="start" font-weight="400">a dense forest canopy can enclose the ceiling; one side can be partly both.</text></svg>