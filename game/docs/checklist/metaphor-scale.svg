<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 292" width="900" height="292" font-family="Helvetica, Arial, sans-serif"><rect width="900" height="292" fill="#fbf7ee"/><text x="24" y="34" font-size="20" fill="#2f343c" text-anchor="start" font-weight="700">How far from the product the scene may sit</text><rect x="40" y="120" width="820" height="16" rx="8" fill="#e6dccb"/><rect x="300" y="120" width="330" height="16" rx="8" fill="#2a8d6a"/><circle cx="110" cy="128" r="13" fill="#c8452f"/><text x="110" y="172" font-size="14.5" fill="#2f343c" text-anchor="middle" font-weight="700">The app shown on</text><text x="110" y="192" font-size="14.5" fill="#2f343c" text-anchor="middle" font-weight="700">a phone or screen</text><text x="110" y="216" font-size="13" fill="#c8452f" text-anchor="middle" font-weight="400">"don't express it literally"</text><circle cx="370" cy="128" r="13" fill="#2a8d6a"/><text x="370" y="172" font-size="14.5" fill="#2f343c" text-anchor="middle" font-weight="700">Homes with sale and rent</text><text x="370" y="192" font-size="14.5" fill="#2f343c" text-anchor="middle" font-weight="700">signs, a flyer board</text><text x="370" y="216" font-size="13" fill="#2a8d6a" text-anchor="middle" font-weight="400">built on "build it"</text><circle cx="560" cy="128" r="13" fill="#2a8d6a"/><text x="560" y="172" font-size="14.5" fill="#2f343c" text-anchor="middle" font-weight="700">A shop for an online</text><text x="560" y="192" font-size="14.5" fill="#2f343c" text-anchor="middle" font-weight="700">shop (Blibli)</text><text x="560" y="216" font-size="13" fill="#2a8d6a" text-anchor="middle" font-weight="400">approved</text><circle cx="790" cy="128" r="13" fill="#c8452f"/><text x="790" y="172" font-size="14.5" fill="#2f343c" text-anchor="middle" font-weight="700">Birdhouses and birds,</text><text x="790" y="192" font-size="14.5" fill="#2f343c" text-anchor="middle" font-weight="700">shells and crabs</text><text x="790" y="216" font-size="13" fill="#c8452f" text-anchor="middle" font-weight="400">"metaphor is too far"</text><text x="40" y="100" font-size="14" fill="#c8452f" text-anchor="start" font-weight="700">too literal</text><text x="860" y="100" font-size="14" fill="#c8452f" text-anchor="end" font-weight="700">too far</text><text x="465" y="100" font-size="14" fill="#2a8d6a" text-anchor="middle" font-weight="700">the product as a real place, touched by hand</text><text x="40" y="254" font-size="14" fill="#6b7480" text-anchor="start" font-weight="400">Also ruled out: a mini-game inside the game ("You shouldn't work out a game in game"), and text or screenshots that explain the</text><text x="40" y="274" font-size="14" fill="#6b7480" text-anchor="start" font-weight="400">project ("Tell the story from scene and interaction, not by text description").</text></svg>